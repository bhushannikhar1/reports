<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>WinCC Alarm Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .card { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 6px; }
        .row { margin-bottom: 15px; }
        label { display: inline-block; width: 110px; font-weight: bold; }
        .error { color: #d9534f; font-size: 0.9em; margin-top: 5px; }
        button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Alarm Log Report</h2>

    <form id="alarmForm" th:action="@{/alert-report/generate}" th:object="${reportRequest}" method="post" >
        <div th:if="${#fields.hasGlobalErrors()}" class="error">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="row">
            <label>From Date:</label>
            <input type="date" th:field="*{fromDate}" required />
            <input type="time" th:field="*{fromTime}" required />
        </div>

        <div class="row">
            <label>To Date:</label>
            <input type="date" th:field="*{toDate}" required />
            <input type="time" th:field="*{toTime}" required />
        </div>

        <div class="row">
            <label>Area:</label>
            <select th:field="*{area}">
                <option value="">-- Please Select Area --</option>
                <option th:each="a : ${areas}" th:value="${a}" th:text="${a}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></div>
        </div>

        <div class="row">
            <button type="submit">Generate Alarm Report</button>
            <button type="button" onclick="resetToNow()">Clear</button>
        </div>
    </form>
</div>

<script>
    function resetToNow() {
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().slice(0, 5);
        document.querySelector('[name="fromDate"]').value = dateStr;
        document.querySelector('[name="toDate"]').value = dateStr;
        document.querySelector('[name="fromTime"]').value = timeStr;
        document.querySelector('[name="toTime"]').value = timeStr;
        document.querySelector('[name="area"]').selectedIndex = 0;
    }
</script>
</body>
</html>
