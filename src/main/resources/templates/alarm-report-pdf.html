<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <style>
        @page { size: A4 landscape; margin: 12mm; }
        body { font-family: Arial, sans-serif; font-size: 10px; color: #000; }
        .header-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .header-table td { border: 1px solid #444; padding: 5px 8px; }
        .title { font-size: 15px; font-weight: bold; text-align: center; background-color: #e9ecef; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { border: 1px solid #444; padding: 5px; text-align: left; }
        .data-table th { background-color: #d9e1f2; font-weight: bold; }
    </style>
</head>
<body>

<table class="header-table">
    <tr>
        <td colspan="4" class="title">ALARM LOG REPORT</td>
    </tr>
    <tr>
        <td style="width: 15%;"><strong>From Date &amp; Time:</strong></td>
        <td style="width: 35%;" th:text="${fromDate}"></td>
        <td style="width: 15%;"><strong>Area:</strong></td>
        <td style="width: 35%;" th:text="${area}"></td>
    </tr>
    <tr>
        <td><strong>To Date &amp; Time:</strong></td>
        <td th:text="${toDate}"></td>
        <td><strong>Generated By:</strong></td>
        <td th:text="${username}"></td>
    </tr>
</table>

<table class="data-table">
    <thead>
    <tr>
        <th style="width: 5%;">Sr. No</th>
        <th style="width: 18%;">Date &amp; Time (IST)</th>
        <th style="width: 47%;">Alarm Description</th>
        <th style="width: 15%;">Status</th>
        <th style="width: 15%;">User</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, stat : ${alarms}">
        <td th:text="${stat.count}"></td>
        <td th:text="${item.formattedDateTime}"></td>
        <td th:text="${item.alarmText}"></td>
        <td th:text="${item.ackStatus}"></td>
        <td th:text="${item.username}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(alarms)}">
        <td colspan="5" style="text-align: center;">No alarms found for the selected criteria.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
