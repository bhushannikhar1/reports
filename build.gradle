plugins {
	id 'java'
	id 'application'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.syntropic.industrial'
version = '0.0.1-SNAPSHOT'

application {
	mainClass = 'com.syntropic.industrial.reports.ReportsApplication'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

javafx {
	version = '25'
	modules = ['javafx.controls', 'javafx.web']
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.webjars.npm:flatpickr:4.6.13'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Keep devtools disabled so it doesn't interfere with JavaFX's classloader
	// developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'io.github.openhtmltopdf:openhtmltopdf-core:1.1.22'
	implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.22'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'


//	local
	runtimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
