//def jpackageTool = "${javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath}/bin/jpackage"
def isMac = System.getProperty('os.name').toLowerCase().contains('mac')
def stagingInputDir = isMac ? '/tmp/jpackage-reports-input' : layout.buildDirectory.dir('jpackage-staging-input').get().asFile.absolutePath
def stagingOutDir = isMac ? '/tmp/jpackage-reports-out' : layout.buildDirectory.dir('jpackage-staging-out').get().asFile.absolutePath
def jpackageTool = "${javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath}/bin/jpackage"

//for mac. Disable for git runner of windows
tasks.named('jar') {
	enabled = true
}
//till here

tasks.register('prepareJpackageInput', Copy) {
	dependsOn 'jar'
	doFirst {
		file(stagingInputDir).deleteDir()
	}
	into stagingInputDir
	from(tasks.named('jar'))
	from(configurations.runtimeClasspath)
}

tasks.register('packageApp', Exec) {
	dependsOn 'prepareJpackageInput'

	doFirst {
		file(stagingOutDir).deleteDir()
	}

	def plainJarName = tasks.named('jar').get().archiveFile.get().asFile.name

	commandLine jpackageTool,
			'--name', 'IndustrialReports',
			'--app-version', '1.0.0',
			'--input', stagingInputDir,
			'--main-jar', plainJarName,
			'--main-class', 'com.syntropic.industrial.reports.ReportsApplication',
			'--type', 'app-image',
			'--dest', stagingOutDir,
			'--java-options', '--module-path $APPDIR --add-modules javafx.controls,javafx.web',
			'--java-options', '-Dprism.order=sw',
			'--java-options', '-Dfile.encoding=UTF-8'
}

tasks.register('collectPackage', Copy) {
	dependsOn 'packageApp'
	doFirst {
		delete layout.buildDirectory.dir('jpackage-out')
	}
	from stagingOutDir
	into layout.buildDirectory.dir('jpackage-out')
}
