name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows App Image
        run: .\gradlew.bat collectPackage --info

      - name: Prepare Artifact Folder
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item -Path "build\jpackage-out\*" -Destination "dist-windows\" -Recurse -Force
          Get-ChildItem -Path "dist-windows" -Recurse

      - name: Upload Windows App Zip
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialReports-Windows
          path: dist-windows
          if-no-files-found: error
