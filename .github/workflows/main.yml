name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Build Windows App Image
        run: .\gradlew.bat collectPackage

      - name: Upload Windows App Zip
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialReports-Windows
          path: build/jpackage-out/IndustrialReports/
